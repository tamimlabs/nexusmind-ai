name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Required to commit the badge JSON on master pushes.
permissions:
  contents: write

# Rapid successive pushes: only the latest run may write the badge,
# older runs are cancelled instead of racing each other's commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No requirements.txt exists; point the cache key at the lock
          # source of truth so dependency changes actually bust the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # continue-on-error lets the badge reflect a red result instead of
      # aborting before it is written; the final step re-fails the job so
      # PR gating stays honest.
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ -q --no-header -p no:cacheprovider 2>&1 | tee pytest_output.txt

      - name: Update badge and commit (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' pytest_output.txt | tail -1 | cut -d' ' -f1)
          FAILED=$(grep -oE '[0-9]+ failed' pytest_output.txt | tail -1 | cut -d' ' -f1)
          ERRORS=$(grep -oE '[0-9]+ error' pytest_output.txt | tail -1 | cut -d' ' -f1)
          FAILED=${FAILED:-0}
          ERRORS=${ERRORS:-0}

          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            printf '{"schemaVersion": 1, "label": "tests", "message": "%s passing", "color": "brightgreen"}\n' \
              "$PASSED" > .github/badges/tests.json
          elif [ -z "$PASSED" ] && [ "$ERRORS" != "0" ]; then
            printf '{"schemaVersion": 1, "label": "tests", "message": "%s collection errors", "color": "red"}\n' \
              "$ERRORS" > .github/badges/tests.json
          else
            printf '{"schemaVersion": 1, "label": "tests", "message": "%s passing, %s failed", "color": "red"}\n' \
              "${PASSED:-0}" "$FAILED" > .github/badges/tests.json
          fi
          cat .github/badges/tests.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update tests badge [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Fail if tests failed
        if: steps.pytest.outcome != 'success'
        run: |
          echo "::error::Test suite did not pass"
          exit 1
