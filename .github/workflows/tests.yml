name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: mypy
        run: mypy agent api cloud --ignore-missing-imports || true

  test:
    name: pytest shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Create .env for tests
        run: |
          cp .env.example .env
          # CI placeholder key; manual Key 1 is active (no auto-rotation)
          if grep -q "^GEMINI_API_KEY=" .env; then
            sed -i 's/^GEMINI_API_KEY=.*/GEMINI_API_KEY=ci-placeholder-key/' .env
          else
            echo "GEMINI_API_KEY=ci-placeholder-key" >> .env
          fi
          if ! grep -q "^GEMINI_ACTIVE_KEY_INDEX=" .env; then
            echo "GEMINI_ACTIVE_KEY_INDEX=1" >> .env
          fi
          cat .env
      - name: Run tests (shard ${{ matrix.shard }}/3)
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ --splits 3 --group ${{ matrix.shard }} -q --no-header -p no:cacheprovider -n auto --dist loadscope --junitxml=pytest_report_${{ matrix.shard }}.xml 2>&1 | tee pytest_output_${{ matrix.shard }}.txt
      - name: Upload shard report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.shard }}
          path: |
            pytest_report_${{ matrix.shard }}.xml
            pytest_output_${{ matrix.shard }}.txt

  badge:
    name: update badge
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-report-*
          merge-multiple: true
      - name: Merge JUnit reports and update badge
        run: |
          mkdir -p .github/badges
          python -c "
          import xml.etree.ElementTree as ET, glob
          total=err=fail=0
          for f in glob.glob('pytest_report_*.xml'):
              try:
                  root=ET.parse(f).getroot()
                  total+=int(root.attrib.get('tests',0))
                  err+=int(root.attrib.get('errors',0))
                  fail+=int(root.attrib.get('failures',0))
              except Exception as e: print(e)
          print(f'Merged: {total} tests, {fail} failures, {err} errors')
          open('merged.txt','w').write(f'{total} {fail} {err}')
          "
          cat merged.txt
          read total fail err < merged.txt
          if [ "$fail" -eq 0 ] && [ "$err" -eq 0 ]; then outcome=success; else outcome=failure; fi
          echo "Overall: $outcome"
          cp pytest_report_1.xml pytest_report.xml 2>/dev/null || cp pytest_report_*.xml pytest_report.xml
          python .github/scripts/update_badge.py pytest_report.xml .github/badges/tests.json "$outcome"
          python -c "
          import json, glob, xml.etree.ElementTree as ET
          p='.github/badges/tests.json'
          data=json.load(open(p))
          total=sum(int(ET.parse(f).getroot().attrib.get('tests',0)) for f in glob.glob('pytest_report_*.xml'))
          fail=sum(int(ET.parse(f).getroot().attrib.get('failures',0)) for f in glob.glob('pytest_report_*.xml'))
          data['total']=total
          data['passed']=total-fail
          json.dump(data, open(p,'w'), indent=2)
          print(open(p).read())
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update tests badge [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: Fail if any shard failed
        if: needs.test.result != 'success'
        run: |
          echo "::error::One or more shards failed"
          exit 1
