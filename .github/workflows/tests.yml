name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Required to commit the badge JSON on master pushes.
permissions:
  contents: write

# Rapid successive pushes: only the latest run may write the badge,
# older runs are cancelled instead of racing each other's commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No requirements.txt exists; point the cache key at the lock
          # source of truth so dependency changes actually bust the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # Tests assume a project-root .env exists — Settings and the credentials
      # code both read _PROJECT_ROOT/.env. Fresh CI checkouts have none (it's
      # gitignored), so synthesize one from the example with a placeholder key.
      - name: Create .env for tests
        run: |
          cp .env.example .env
          sed -i 's/^GEMINI_API_KEY=.*/GEMINI_API_KEY=ci-placeholder-key/' .env

      # continue-on-error lets the badge reflect a red result instead of
      # aborting before it is written; the final step re-fails the job so
      # PR gating stays honest.
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ --junitxml=pytest_report.xml -q --no-header -p no:cacheprovider 2>&1 | tee pytest_output.txt

      # Counts come from the JUnit XML report (machine-readable, stable
      # schema) instead of grepping pytest stdout.
      - name: Update badge and commit (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .github/badges
          python .github/scripts/update_badge.py \
            pytest_report.xml .github/badges/tests.json "${{ steps.pytest.outcome }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update tests badge [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Fail if tests failed
        if: steps.pytest.outcome != 'success'
        run: |
          echo "::error::Test suite did not pass"
          exit 1
