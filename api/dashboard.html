<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMind AI</title>
    <link rel="icon" type="image/png" href="/docs/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg0:#000;--bg1:#09090b;--bg2:#111113;--bg3:#18181b;--bg4:#1f1f23;--bg5:#27272a;--border:#27272a;--bhover:#3f3f46;--t1:#fafafa;--t2:#e4e4e7;--t3:#a1a1aa;--t4:#71717a;--t5:#52525b;--accent:#22c55e;--ahov:#16a34a;--abg:rgba(34,197,94,.08);--abad:rgba(34,197,94,.25);--blue:#3b82f6;--bbg:rgba(59,130,246,.08);--bad:rgba(59,130,246,.25);--purple:#a855f7;--pbg:rgba(168,85,247,.08);--pad:rgba(168,85,247,.25);--yellow:#eab308;--ybg:rgba(234,179,8,.08);--yad:rgba(234,179,8,.25);--red:#ef4444;--rbg:rgba(239,68,68,.08);--rad:rgba(239,68,68,.25);--r:6px;--rm:8px;--rl:12px;--tr:120ms ease;--mono:'JetBrains Mono','SF Mono',monospace}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg0);color:var(--t2);-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden;height:100vh}
        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
        .app{display:flex;height:100vh}

        .sidebar{width:240px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
        .sb-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .sb-logo{width:32px;height:32px;border-radius:8px;flex-shrink:0;object-fit:contain}
        .sb-brand-name{font-size:14px;font-weight:600;color:var(--t1)}.sb-brand-sub{font-size:11px;color:var(--t4)}
        .sb-section{padding:16px 12px 8px}.sb-section-title{font-size:11px;font-weight:600;color:var(--t5);text-transform:uppercase;letter-spacing:.08em;padding:0 4px;margin-bottom:8px}
        .sb-nav{list-style:none}.sb-nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);color:var(--t3);text-decoration:none;font-size:13px;font-weight:500;transition:all var(--tr);cursor:pointer}
        .sb-nav a:hover{background:var(--bg3);color:var(--t2)}.sb-nav a.active{background:var(--abg);color:var(--accent)}
        .sb-nav .nb{margin-left:auto;font-size:11px;font-weight:600;background:var(--bg4);color:var(--t4);padding:1px 6px;border-radius:10px}
        .sb-nav a.active .nb{background:var(--abg);color:var(--accent)}
        .sb-nav .nb.alert{background:var(--rbg);color:var(--red);animation:pulse 1.5s ease-in-out infinite}
        .sb-status{padding:12px;margin-top:auto;border-top:1px solid var(--border)}
        .as-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);padding:12px}
        .as-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
        .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.sdot.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}.sdot.off{background:var(--red)}
        .sstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .sval{font-size:16px;font-weight:600;color:var(--t1);font-family:var(--mono)}.slbl{font-size:10px;color:var(--t4);text-transform:uppercase;letter-spacing:.05em}

        .main{flex:1;display:flex;flex-direction:column;min-width:0}
        .topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg1);flex-shrink:0}
        .topbar-title{font-size:13px;font-weight:500;color:var(--t3)}
        .topbar-right{display:flex;align-items:center;gap:8px}
        .tb-btn{background:none;border:1px solid var(--border);color:var(--t3);border-radius:var(--r);padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;transition:all var(--tr);display:flex;align-items:center;gap:4px}
        .tb-btn:hover{border-color:var(--bhover);color:var(--t2);background:var(--bg3)}
        .page{flex:1;overflow-y:auto;padding:20px}

        .rpanel{width:400px;border-left:1px solid var(--border);background:var(--bg1);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .25s ease;position:relative}
        .rpanel-toggle{position:absolute;top:7px;right:7px;z-index:5;background:none;border:none;color:var(--t4);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center}
        .rpanel-toggle:hover{color:var(--t1);background:var(--bg3)}
        .rpanel-toggle svg{transition:transform .25s ease}
        body.rp-min .rpanel{width:36px}
        body.rp-min .rpanel-tabs,body.rp-min .rpanel-body{display:none}
        body.rp-min .rpanel-toggle{position:static;margin-top:8px;align-self:center}
        body.rp-min .rpanel-toggle svg{transform:rotate(180deg)}
        .rp-collapsed-label{display:none;writing-mode:vertical-rl;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--t4);margin-top:12px;cursor:pointer;user-select:none}
        body.rp-min .rp-collapsed-label{display:block}
        .rp-collapsed-label:hover{color:var(--accent)}
        .rpanel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
        .rpanel-tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--t4);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--tr)}
        .rpanel-tab:hover{color:var(--t2)}.rpanel-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
        .rpanel-body{flex:1;overflow-y:auto;padding:12px}

        .input-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:16px}
        .input-row{display:flex;gap:8px}
        .input-field{flex:1;background:var(--bg0);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;color:var(--t1);font-family:'Inter',sans-serif;font-size:13px;transition:all var(--tr);outline:none}
        .input-field::placeholder{color:var(--t5)}.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
        .btn{border:none;border-radius:var(--r);padding:8px 16px;font-weight:600;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
        .btn-p{background:var(--accent);color:#000}.btn-p:hover{background:var(--ahov)}.btn-p:disabled{opacity:.4;cursor:not-allowed}
        .btn-g{background:transparent;color:var(--t3);border:1px solid var(--border)}.btn-g:hover{background:var(--bg3);color:var(--t2);border-color:var(--bhover)}
        .btn-d{background:var(--rbg);color:var(--red);border:1px solid var(--rad)}.btn-d:hover{background:rgba(239,68,68,.15)}
        .btn-sm{padding:5px 10px;font-size:12px}

        .loading-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);margin-bottom:12px}
        .spinner{width:14px;height:14px;border:2px solid var(--bg5);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .task-list{display:flex;flex-direction:column;gap:6px}
        .task-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);padding:14px 16px;cursor:pointer;transition:all var(--tr)}
        .task-card:hover{border-color:var(--bhover)}.task-card.sel{border-color:var(--abad);background:var(--abg)}
        .tc-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
        .tc-goal{font-size:13px;font-weight:500;color:var(--t1);line-height:1.4;flex:1}
        .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0}
        .b-completed{background:var(--abg);color:var(--accent)}.b-failed{background:var(--rbg);color:var(--red)}
        .b-executing{background:var(--ybg);color:var(--yellow)}.b-planning{background:var(--pbg);color:var(--purple)}.b-pending{background:var(--bbg);color:var(--blue)}.b-needs_instruction{background:var(--ybg);color:var(--yellow);border:1px dashed var(--yellow)}
        .tc-meta{display:flex;gap:12px;font-size:11px;color:var(--t4);font-family:var(--mono)}
        .tc-result{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--t3);line-height:1.5}
        .tc-error{margin-top:8px;padding:8px 10px;background:var(--rbg);border:1px solid var(--rad);border-radius:var(--r);font-size:12px;color:var(--red)}
        .tc-actions{display:flex;gap:4px;margin-top:8px}

        .detail-header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
        .detail-goal{font-size:16px;font-weight:600;color:var(--t1);flex:1}
        .detail-section{margin-bottom:16px}
        .detail-label{font-size:11px;font-weight:600;color:var(--t5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
        .detail-text{font-size:13px;color:var(--t2);line-height:1.6}
        .detail-code{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;color:var(--t2);overflow-x:auto;white-space:pre-wrap;word-break:break-all}

        .timeline{position:relative;padding-left:24px}
        .timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--border)}
        .tl-step{position:relative;margin-bottom:12px}
        .tl-dot{position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg0)}
        .tl-dot.success{background:var(--accent);box-shadow:0 0 6px rgba(34,197,94,.4)}.tl-dot.failed{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.4)}
        .tl-dot.running{background:var(--yellow);animation:pulse 1.5s ease-in-out infinite}.tl-dot.pending{background:var(--t5)}
        .tl-dot.skipped{background:var(--bg4)}
        .todo-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px;color:var(--t2)}
        .todo-row:last-child{border-bottom:none}
        .todo-check{font-family:var(--mono);font-size:12px;width:14px;flex-shrink:0;color:var(--t5)}
        .todo-title{flex:1}
        .todo-title.done{text-decoration:line-through;color:var(--t5)}
        .todo-title.skipped{text-decoration:line-through;color:var(--t5);opacity:.7}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .tl-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);padding:12px 14px;transition:all var(--tr)}
        .tl-card:hover{border-color:var(--bhover)}
        .tl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
        .tl-num{font-size:11px;font-weight:700;color:var(--t4);font-family:var(--mono)}
        .tl-desc{font-size:13px;font-weight:500;color:var(--t1)}
        .tl-tool{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--bbg);color:var(--blue);margin-top:6px}
        .tl-tool.high{background:var(--ybg);color:var(--yellow)}
        .tl-detail{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--t4);background:var(--bg3);border-radius:var(--r);padding:8px 10px;max-height:120px;overflow-y:auto;display:none;white-space:pre-wrap;word-break:break-all;line-height:1.5}
        .tl-detail.show{display:block}
        .tl-expand{font-size:11px;color:var(--t4);cursor:pointer;margin-top:4px}.tl-expand:hover{color:var(--accent)}

        .trace-item{padding:10px 12px;border-bottom:1px solid var(--border);transition:background var(--tr);cursor:pointer}
        .trace-item:hover{background:var(--bg3)}.trace-item:last-child{border-bottom:none}
        .ti-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
        .ti-name{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--t2)}
        .ti-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
        .ti-dot.reasoning{background:var(--purple)}.ti-dot.tool_call{background:var(--blue)}.ti-dot.approval{background:var(--yellow)}.ti-dot.error{background:var(--red)}
        .ti-time{font-size:10px;font-family:var(--mono);color:var(--t5)}
        .ti-detail{font-size:11px;color:var(--t4);font-family:var(--mono);max-height:60px;overflow:hidden;text-overflow:ellipsis;line-height:1.4}

        .approval-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--yellow);border-radius:var(--rm);padding:12px;margin-bottom:8px}
        .ac-desc{font-size:12px;color:var(--t2);margin-bottom:8px}.ac-desc strong{color:var(--yellow)}
        .ac-actions{display:flex;gap:6px}

        .think-list{display:flex;flex-direction:column;gap:6px}
        .think-item{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--t5);border-radius:var(--rm);padding:10px 12px;animation:fadeIn .2s ease}
        .think-item.received{border-left-color:var(--blue)}.think-item.thinking{border-left-color:var(--purple)}.think-item.step_running{border-left-color:var(--blue)}
        .think-item.tool_output{border-left-color:var(--blue)}.think-item.done{border-left-color:var(--accent)}.think-item.error{border-left-color:var(--red)}
        .think-msg{font-size:12px;font-weight:500;color:var(--t1);display:flex;align-items:center;gap:6px}
        .think-detail{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--t4);white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:120px;overflow-y:auto;display:none;background:var(--bg3);border-radius:var(--r);padding:8px 10px}
        .think-detail.show{display:block}
        .think-time{font-size:10px;font-family:var(--mono);color:var(--t5);margin-top:4px}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

        .mem-search{display:flex;gap:8px;margin-bottom:12px}
        .mem-filters{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
        .mem-filter{font-size:11px;font-weight:500;padding:4px 10px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer;transition:all var(--tr)}
        .mem-filter:hover{border-color:var(--bhover);color:var(--t2)}.mem-filter.active{background:var(--abg);color:var(--accent);border-color:var(--abad)}
        .mem-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);padding:12px;margin-bottom:6px}
        .mem-content{font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:6px}
        .mem-cat{font-size:10px;font-weight:600;padding:2px 6px;border-radius:100px;display:inline-block}
        .mem-cat.reflection{background:var(--pbg);color:var(--purple)}.mem-cat.task_outcome{background:var(--bbg);color:var(--blue)}.mem-cat.skill{background:var(--abg);color:var(--accent)}

        .empty{text-align:center;padding:40px 20px;color:var(--t5);font-size:13px}
        .empty-big{padding:60px 20px}
        .empty-sub{font-size:12px;color:var(--t5);margin-top:4px}
        .toggle{position:relative;width:36px;height:20px;background:var(--bg4);border-radius:10px;cursor:pointer;transition:background var(--tr);border:none}
        .toggle.on{background:var(--accent)}
        .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform var(--tr)}
        .toggle.on::after{transform:translateX(16px)}
        .setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
        .setting-label{font-size:13px;color:var(--t2)}.setting-desc{font-size:11px;color:var(--t4);margin-top:2px}
        .tool-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
        .tool-name{font-size:13px;font-family:var(--mono);color:var(--t2)}
        .tool-risk{font-size:10px;font-weight:600;padding:2px 6px;border-radius:100px}.tool-risk.high{background:var(--ybg);color:var(--yellow)}.tool-risk.normal{background:var(--bg3);color:var(--t4)}

        @media(max-width:900px){.sidebar{width:60px}.sb-brand-name,.sb-brand-sub,.sb-section-title,.sb-nav span,.sb-nav .nb,.sstats{display:none}.sb-nav a{justify-content:center;padding:10px}.sb-status{padding:8px}}

        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;animation:modalIn .15s ease forwards}
        .modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:24px;min-width:360px;max-width:440px;box-shadow:0 16px 48px rgba(0,0,0,.5);transform:scale(.95);animation:modalScale .15s ease forwards}
        .modal-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
        .modal-icon.warn{background:var(--rbg);border:1px solid var(--rad)}.modal-icon.warn svg{color:var(--red)}
        .modal-icon.info{background:var(--bbg);border:1px solid var(--bad)}.modal-icon.info svg{color:var(--blue)}
        .modal-icon.err{background:var(--rbg);border:1px solid var(--rad)}.modal-icon.err svg{color:var(--red)}
        .modal-title{font-size:15px;font-weight:600;color:var(--t1);margin-bottom:6px}
        .modal-desc{font-size:13px;color:var(--t3);line-height:1.5;margin-bottom:20px}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end}
        @keyframes modalIn{to{opacity:1}}
        @keyframes modalScale{to{transform:scale(1)}}
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sb-head">
            <img class="sb-logo" src="/docs/nexusmind-dark-icon.png" alt="NexusMind AI" onerror="this.style.background='var(--accent)';this.alt='N'" />
            <div><div class="sb-brand-name">NexusMind AI</div><div class="sb-brand-sub">v0.1.0</div></div>
        </div>
        <div class="sb-section">
            <div class="sb-section-title">Navigation</div>
            <ul class="sb-nav">
                <li><a class="active" data-page="tasks" onclick="switchPage('tasks')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>Tasks</span><span class="nb" id="taskCount">0</span></a></li>
                <li><a data-page="memory" onclick="switchPage('memory')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    <span>Memory</span><span class="nb" id="memCount">0</span></a></li>
                <li><a data-page="approvals" onclick="switchPage('approvals')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M9 12l2 2 4-4"/></svg>
                    <span>Approvals</span><span class="nb" id="approvalCount">0</span></a></li>
                <li><a data-page="watchers" onclick="switchPage('watchers')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>Watchers</span><span class="nb" id="watcherCount">0</span></a></li>
                <li><a data-page="settings" onclick="switchPage('settings')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <span>Settings</span></a></li>
                <li><a data-page="credentials" onclick="switchPage('credentials')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                    <span>Credentials</span><span class="nb" id="credCount">0</span></a></li>
            </ul>
        </div>
        <div class="sb-status">
            <div class="as-card">
                <div class="as-top"><div class="sdot on" id="agentDot"></div><span style="font-size:12px;font-weight:600;color:var(--t2)" id="agentLabel">Agent Online</span></div>
                <div style="font-size:11px;color:var(--t4);margin-bottom:8px;font-family:var(--mono)" id="agentModel">--</div>
                <div class="sstats">
                    <div><div class="sval" id="toolCount">0</div><div class="slbl">Tools</div></div>
                    <div><div class="sval" id="memSize">0</div><div class="slbl">Memory</div></div>
                </div>
            </div>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="pageTitle">Tasks</div>
            <div class="topbar-right">
                <button class="tb-btn" onclick="refreshAll()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Refresh
                </button>
                <button class="tb-btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
                    <div class="toggle" id="autoToggle"></div>
                    Auto
                </button>
            </div>
        </div>
        <div class="page" id="pageContent"></div>
    </div>

    <aside class="rpanel">
        <button class="rpanel-toggle" onclick="toggleRPanel()" title="Minimize / restore panel (state is remembered)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="rp-collapsed-label" onclick="toggleRPanel()" title="Restore panel">Panel</div>
        <div class="rpanel-tabs">
            <div class="rpanel-tab active" onclick="switchRTab('trace')">Trace</div>
            <div class="rpanel-tab" onclick="switchRTab('thinking')">Thinking</div>
            <div class="rpanel-tab" onclick="switchRTab('approvals')">Approvals</div>
            <div class="rpanel-tab" onclick="switchRTab('checklist')">Checklist</div>
        </div>
        <div class="rpanel-body" id="rpanelBody">
            <div class="empty empty-big">Select a task to view its trace</div>
        </div>
    </aside>
</div>

<script>
const S={tasks:[],selected:null,page:'tasks',rtab:'trace',autoRefresh:false,pollInterval:null,agentStatus:null,approvals:[],memory:[],memFilter:'all',liveEvents:[],liveTaskId:null,liveStatus:'running',livePoll:null,watchers:[]};

function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

/* ── Custom Modal ─────────────────────────────────────────────── */
function showModal({type,title,message,confirmText='Confirm',cancelText='Cancel',onConfirm}){
  const old=document.getElementById('modalRoot');if(old)old.remove();
  const svgs={danger:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',error:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',info:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'};
  const ic={danger:'warn',error:'err',info:'info'};
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal-overlay" id="modalRoot"><div class="modal"><div class="modal-icon '+(ic[type]||'info')+'">'+(svgs[type]||svgs.info)+'</div><div class="modal-title">'+esc(title)+'</div><div class="modal-desc">'+esc(message)+'</div><div class="modal-actions">'+(cancelText?'<button class="btn btn-g" onclick="closeModal()">'+esc(cancelText)+'</button>':'')+'<button class="btn '+(type==='danger'?'btn-d':'btn-p')+'" id="modalConfirmBtn">'+esc(confirmText)+'</button></div></div></div>');
  document.getElementById('modalConfirmBtn').onclick=()=>{closeModal();if(onConfirm)onConfirm()};
}
function closeModal(){const m=document.getElementById('modalRoot');if(m)m.remove()}
function modalConfirm(title,msg){return new Promise(r=>{showModal({type:'danger',title,message:msg,confirmText:'Delete',cancelText:'Cancel',onConfirm:()=>r(true)});document.onkeydown=e=>{if(e.key==='Escape'){closeModal();document.onkeydown=null;r(false)}}})}
function modalAlert(title,msg,type){showModal({type:type||'info',title,message:msg,confirmText:'OK',cancelText:'',onConfirm(){}})}

/* ── Navigation ───────────────────────────────────────────────── */
function switchPage(p){S.page=p;document.querySelectorAll('.sb-nav a').forEach(a=>{a.classList.toggle('active',a.dataset.page===p)});document.getElementById('pageTitle').textContent={tasks:'Tasks',memory:'Memory',approvals:'Approvals',watchers:'Watchers',settings:'Settings',credentials:'Credentials'}[p];renderPage()}
function switchRTab(t){S.rtab=t;document.querySelectorAll('.rpanel-tab').forEach((tab,i)=>{tab.classList.toggle('active',(i===0&&t==='trace')||(i===1&&t==='thinking')||(i===2&&t==='approvals')||(i===3&&t==='checklist'))});renderRPanel()}
function renderPage(){const c=document.getElementById('pageContent');if(S.page==='tasks')renderTasksPage(c);else if(S.page==='memory')renderMemoryPage(c);else if(S.page==='approvals')renderApprovalsPage(c);else if(S.page==='watchers')renderWatchersPage(c);else if(S.page==='settings')renderSettingsPage(c);else if(S.page==='credentials')renderCredentialsPage(c)}
function renderRPanel(){const c=document.getElementById('rpanelBody');if(S.rtab==='trace')renderTracePanel(c);else if(S.rtab==='thinking')renderThinkingPanel(c);else if(S.rtab==='checklist')renderChecklistPanel(c);else renderApprovalPanel(c)}

/* ── Task Views ───────────────────────────────────────────────── */
function renderTasksPage(c){
  const prevVal=document.getElementById('goalInput')?document.getElementById('goalInput').value:'';
  const prevSteps=document.getElementById('maxStepsInput')?document.getElementById('maxStepsInput').value:'';
  let html='<div class="input-card"><div class="input-row"><input class="input-field" id="goalInput" placeholder="Describe what you want the agent to do..." /><input class="input-field" id="maxStepsInput" type="number" min="5" max="120" placeholder="steps" title="Max steps — elastic. Leave blank for auto (40→120 as needed, opencode-style long runs)" style="max-width:78px" /><button class="btn btn-p" id="submitBtn" onclick="submitTask()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg> Run</button></div><div style="font-size:11px;color:var(--t5);margin-top:6px">Auto = short tasks finish fast, long builds auto-extend to 120 steps (opencode-like). Set a cap if you want it longer/shorter.</div></div>';
  // One cancel per page: loadingBar only in list view, detail header has its own Cancel (S.selected). Prevents duplicate 2× Cancel.
  if(!S.selected) html+='<div id="loadingBar" class="loading-bar" style="display:none"><div class="spinner"></div><span style="font-size:12px;color:var(--t3)">Agent is working...</span><button class="btn btn-d btn-sm" style="margin-left:auto" onclick="cancelCurrentTask()">Cancel</button></div>';
  else html+='<div id="loadingBar" style="display:none"></div>';
  html+='<div class="task-list" id="taskListEl">';
  if(S.selected){html+=renderDetail(S.selected)}
  else if(S.tasks.length===0){html+='<div class="empty empty-big"><div style="font-size:24px;opacity:.3;margin-bottom:12px">&#9881;</div>No tasks yet<div class="empty-sub">Submit a goal above to get started</div></div>'}
  else{S.tasks.forEach(t=>{
    const a=S.selected&&S.selected.id===t.id;
    const isNeeds=t.status==='needs_instruction';
    html+='<div class="task-card'+(a?' sel':'')+(isNeeds?' style="border-left:3px solid var(--yellow)"':'')+'" onclick="selectTask(\''+t.id+'\')"><div class="tc-row"><div class="tc-goal">'+(isNeeds?'⚠️ ':'')+esc(t.goal)+'</div><span class="badge b-'+t.status+'">'+t.status.replace('_',' ')+'</span></div><div class="tc-meta"><span>'+(t.steps_count||0)+' steps</span><span>'+t.id.slice(0,8)+'</span>'+(isNeeds?'<span style="color:var(--yellow)">needs instruction</span>':'')+'</div>'+(t.result?'<div class="tc-result">'+esc(t.result.slice(0,300))+'</div>':'')+(t.error?'<div class="tc-error">'+esc(t.error)+'</div>':'')+'<div class="tc-actions">'+(isNeeds?'<button class="btn btn-p btn-sm" onclick="event.stopPropagation();quickFixInstruction(\''+t.id+'\')">✨ Create Instruction</button>':'')+'<button class="btn btn-d btn-sm" onclick="event.stopPropagation();deleteTask(\''+t.id+'\')">Delete</button></div></div>'})}
  html+='</div>';c.innerHTML=html;const inp=document.getElementById('goalInput');if(inp){inp.value=prevVal;inp.addEventListener('keypress',e=>{if(e.key==='Enter')submitTask()});inp.focus()}}

function quickFixInstruction(taskId){
  const t=S.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const watcherType=t.watcher_type||'github';
  const suggestion=watcherType==='github' ? 'when a pr arrives, test every PR separately, if tests fail decline with comment, if clean and relevant merge it, otherwise reject with reason' : 'when a '+watcherType+' event arrives, handle it helpfully';
  switchPage('memory');
  setTimeout(()=>{
    const ta=document.getElementById('memNewText');
    if(ta){ta.value=suggestion; ta.focus(); ta.scrollIntoView({behavior:'smooth'});}
  },200);
}

function renderDetail(t){
  const isNeeds=t.status==='needs_instruction';
  const isRunning=['planning','executing','pending'].includes(t.status)||(S.liveTaskId===t.id&&!['completed','failed'].includes(S.liveStatus));
  let h='<div class="detail-header"><button class="btn btn-g btn-sm" onclick="S.selected=null;renderPage()">&larr; Back</button><div class="detail-goal">'+esc(t.goal)+'</div><span class="badge b-'+t.status+'">'+t.status.replace('_',' ')+'</span>'+(t.elapsed_seconds?'<span class="badge" style="background:var(--bg3);color:var(--t4);border:1px solid var(--border)">⏱ '+t.elapsed_seconds+'s</span>':'')+(isNeeds?'<button class="btn btn-p btn-sm" onclick="quickFixInstruction(\''+t.id+'\')">✨ Create Instruction</button>':'')+(isRunning?'<button class="btn btn-d btn-sm" onclick="cancelCurrentTask()">⏹ Cancel</button>':'')+'<button class="btn btn-d btn-sm" onclick="deleteTask(\''+t.id+'\')">Delete</button></div>';
  if(isNeeds){h+='<div class="detail-section" style="background:var(--ybg);border:1px solid var(--yad);border-radius:8px;padding:12px"><div style="font-size:13px;font-weight:600;color:var(--yellow);margin-bottom:6px">⚠️ Needs your instruction — nothing was executed</div><div style="font-size:12px;color:var(--t3);line-height:1.6">This watcher detected an event but you have no matching standing instruction. Add one in <b>Memory → instruction</b> to auto-handle future events. Telegram was notified (once per 6h). Click <b>Create Instruction</b> for a suggestion.</div></div>';}
  if(S.liveEvents.length>0&&S.liveTaskId===t.id){h+='<div class="detail-section"><div class="detail-label">Live Activity — opencode-style stream <span style="font-weight:400;color:var(--t5)">('+S.liveEvents.length+' events · click detail to expand)</span></div><div class="think-list">';S.liveEvents.forEach((e,i)=>{h+='<div class="think-item '+esc(e.type)+'" onclick="this.querySelector(\'.think-detail\')&&this.querySelector(\'.think-detail\').classList.toggle(\'show\')" style="cursor:pointer"><div class="think-msg">'+thinkIcon(e,i===S.liveEvents.length-1,!['completed','failed'].includes(S.liveStatus))+esc(e.message)+'<span style="margin-left:auto;font-size:10px;color:var(--t5);font-family:var(--mono)">'+new Date(e.time*1000).toLocaleTimeString()+'</span></div>'+(e.detail?'<div class="think-detail'+(i>=S.liveEvents.length-3?' show':'')+'">'+esc(e.detail)+'</div>':'')+'</div>'});h+='</div></div>'}
  if(t.result){const isFileResult=t.result.includes('Saved to:');h+='<div class="detail-section"><div class="detail-label">Result</div><div class="detail-code" style="'+(isFileResult?'border-left:3px solid var(--accent);background:var(--abg)':'')+'">'+esc(t.result)+'</div>'+(isFileResult?'<div style="margin-top:8px;font-size:11px;color:var(--accent)">📁 Check <code>output/</code> or <code>projects/</code> folder for saved files</code></div>':'')+'</div>';}
  if(t.error)h+='<div class="detail-section"><div class="detail-label">Error</div><div class="tc-error">'+esc(t.error)+'</div></div>';
  if(t.todos&&t.todos.length>0){const done=t.todos.filter(x=>x.status==='completed').length;h+='<div class="detail-section"><div class="detail-label">TODO Checklist ('+done+'/'+t.todos.length+')</div>';t.todos.forEach(td=>{const st=td.status||'pending';let dot,chk;if(st==='completed'){dot='<span class="sdot on" style="background:var(--accent)"></span>';chk='[x]'}else if(st==='in_progress'){dot='<span class="tl-dot running" style="position:static;display:inline-block;margin-left:-2px"></span>';chk='[ ]'}else if(st==='skipped'){dot='<span class="tl-dot skipped" style="position:static;display:inline-block;background:var(--red);opacity:.6;margin-left:-2px"></span>';chk='[ ]'}else{dot='<span class="tl-dot pending" style="position:static;display:inline-block;margin-left:-2px"></span>';chk='[ ]'}const cls=st==='completed'||st==='skipped'?' done':'';h+='<div class="todo-row"><span class="todo-check">'+chk+'</span>'+dot+'<span class="todo-title'+cls+'">'+esc(td.title||'')+'</span></div>'});h+='</div>'}
  if(t.steps&&t.steps.length>0){h+='<div class="detail-section"><div class="detail-label">Steps ('+t.steps.length+')</div><div class="timeline">';t.steps.forEach((s,i)=>{const tc=s.tool_name&&(s.tool_name==='execute_code'||s.tool_name==='run_command')?' high':'';h+='<div class="tl-step"><div class="tl-dot '+s.status+'"></div><div class="tl-card"><div class="tl-top"><div class="tl-desc">'+esc(s.description)+'</div><span class="tl-num" style="display:flex;align-items:center;gap:6px">'+(s.status?'<span class="tl-tool" style="margin:0;padding:1px 6px;font-size:10px">'+esc(s.status)+'</span>':'')+'#'+(i+1)+'</span></div>'+(s.tool_name?'<div class="tl-tool'+tc+'">'+esc(s.tool_name)+'</div>':'')+(s.tool_args&&Object.keys(s.tool_args).length?'<div class="tl-expand" onclick="this.nextElementSibling.classList.toggle(\'show\')">Show args</div><div class="tl-detail">'+esc(JSON.stringify(s.tool_args,null,2))+'</div>':'')+(s.result?'<div class="tc-result">'+esc(s.result.slice(0,200))+'</div>':'')+(s.error?'<div class="tc-error">'+esc(s.error)+'</div>':'')+'</div></div>'});h+='</div></div>'}
  return h}

/* ── Right Panel Views ────────────────────────────────────────── */
function renderTracePanel(c){
  if(!S.selected||!S.selected.trace||!S.selected.trace.length){c.innerHTML='<div class="empty empty-big">No trace data</div>';return}
  let h='<div style="font-size:11px;color:var(--t5);margin-bottom:8px">'+S.selected.trace.length+' span'+(S.selected.trace.length!==1?'s':'')+'</div>';
  S.selected.trace.forEach(s=>{const d=typeof s.output==='string'?s.output.slice(0,150):JSON.stringify(s.output||s.input||{}).slice(0,150);h+='<div class="trace-item"><div class="ti-top"><div class="ti-name"><span class="ti-dot '+s.kind+'"></span>'+esc(s.name)+'</div><span class="ti-time">'+(s.duration_ms||0)+'ms</span></div><div class="ti-detail">'+esc(d)+'</div></div>'});c.innerHTML=h}

function thinkIcon(e,isLast,running){
  if(e.type==='thinking')return(running&&isLast)?'<div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div>':'<span style="color:var(--t5)">&#9679;</span>';
  if(e.type==='done')return'<span style="color:#22c55e">&#10003;</span>';
  if(e.type==='error')return'<span style="color:var(--red)">&#10007;</span>';
  if(e.type==='step_running')return(running&&isLast)?'<div class="spinner" style="width:10px;height:10px;border-width:1.5px;border-top-color:var(--blue)"></div>':'<span style="color:var(--blue)">&#9679;</span>';
  if(e.type==='received')return'<span style="color:var(--blue)">&#9679;</span>';
  if(e.type==='token')return'<span style="color:var(--purple)">▌</span>';
  if(e.type==='tool_delta')return'<span style="color:var(--blue)">▸</span>';
  if(e.type==='todo_update')return'<span style="color:var(--accent)">☑</span>';
  return''}

function renderThinkingPanel(c){
  const evs=S.liveEvents||[];
  if(!evs.length){c.innerHTML='<div class="empty empty-big">No live events yet<div class="empty-sub">Submit a task to see agent thinking — opencode-style full visibility (token/tool_delta/todo live)</div></div>';return}
  const running=!['completed','failed'].includes(S.liveStatus);
  const elapsed=S.tasks.find(x=>x.id===S.liveTaskId)?.elapsed_seconds||0;
  let h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--t5)">'+evs.length+' event'+(evs.length!==1?'s':'')+' · '+elapsed+'s'+(running?' <span class="spinner" style="display:inline-block;width:9px;height:9px;border-width:1.5px;vertical-align:middle"></span>':'')+'</span><span style="font-size:10px;color:var(--t5);font-family:var(--mono)">WS+SSE+poller</span></div><div class="think-list">';
  evs.forEach((e,i)=>{const isTool=e.type==='tool_output'||e.type==='step_running'||e.type==='tool_delta';const isToken=e.type==='token';if(isToken&&S.liveEvents.length>200&&i<S.liveEvents.length-20)return; h+='<div class="think-item '+esc(e.type)+'" style="'+(isTool?'border-left-color:var(--blue)':isToken?'border-left-color:var(--purple);opacity:.8':'')+'" onclick="this.querySelector(\'.think-detail\')&&this.querySelector(\'.think-detail\').classList.toggle(\'show\')"><div class="think-msg">'+thinkIcon(e,i===evs.length-1,running)+esc(e.message)+'</div>'+(e.detail?'<div class="think-detail'+(i>=evs.length-2||e.type==='error'||e.type==='todo_update'?' show':'')+'" style="'+(e.detail.length>400?'max-height:220px;overflow-y:auto':'')+'">'+esc(e.detail)+'</div>':'')+'<div class="think-time">'+new Date(e.time*1000).toLocaleTimeString()+'</div></div>'});
  h+='</div>';c.innerHTML=h;c.scrollTop=c.scrollHeight}

function renderApprovalPanel(c){
  if(!S.approvals.length){c.innerHTML='<div class="empty empty-big">No pending approvals</div>';return}
  let h='';S.approvals.forEach(a=>{h+='<div class="approval-card"><div class="ac-desc"><strong>'+esc(a.tool_name||'Unknown')+'</strong><br>'+esc(a.description||a.step_id)+'</div><div class="ac-actions"><button class="btn btn-p btn-sm" onclick="resolveApproval(\''+a.step_id+'\',true)">Approve</button><button class="btn btn-d btn-sm" onclick="resolveApproval(\''+a.step_id+'\',false)">Deny</button></div></div>'});c.innerHTML=h}

function renderChecklistPanel(c){
  let todos=null;
  if(S.liveTaskId){const lt=S.tasks.find(x=>x.id===S.liveTaskId);if(lt&&lt.todos)todos=lt.todos}
  if(!todos&&S.selected&&S.selected.todos)todos=S.selected.todos;
  if(!todos||!todos.length){c.innerHTML='<div class="empty empty-big">No checklist yet<div class="empty-sub">The agent\'s live TODO list appears here while it works (todowrite live)</div></div>';return}
  const done=todos.filter(x=>x.status==='completed').length;
  const running=!['completed','failed'].includes(S.liveStatus);
  let h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--t5)">TODO Checklist '+done+'/'+todos.length+(running?' <span class="spinner" style="display:inline-block;width:9px;height:9px;border-width:1.5px;vertical-align:middle"></span>':'')+'</span><span style="font-size:10px;color:var(--t5);font-family:var(--mono)">WS live</span></div><div class="task-list">';
  todos.forEach(td=>{const st=td.status||'pending';let dot,chk,pri=td.priority||'medium';
    if(st==='completed'){dot='<span class="sdot on" style="background:var(--accent)"></span>';chk='[x]'}
    else if(st==='in_progress'){dot='<span class="tl-dot running" style="position:static;display:inline-block;margin-left:-2px"></span>';chk='[~]'}
    else if(st==='skipped'||st==='cancelled'){dot='<span class="tl-dot skipped" style="position:static;display:inline-block;background:var(--red);opacity:.6;margin-left:-2px"></span>';chk='[-]'}
    else{dot='<span class="tl-dot pending" style="position:static;display:inline-block;margin-left:-2px"></span>';chk='[ ]'}
    const priColor=pri==='high'?'var(--red)':pri==='low'?'var(--t4)':'var(--yellow)';
    h+='<div class="todo-row"><span class="todo-check">'+chk+'</span>'+dot+'<span class="todo-title'+((st==='completed'||st==='skipped'||st==='cancelled')?' done':'')+'">'+esc(td.title||td.content||'')+'</span><span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:100px;border:1px solid '+priColor+';color:'+priColor+'">'+esc(pri)+'</span></div>'});
  h+='</div>';c.innerHTML=h;c.scrollTop=c.scrollHeight}

/* ── Memory Page ──────────────────────────────────────────────── */
function renderMemoryPage(c){
  let h='<div class="input-card"><textarea class="input-field" id="memNewText" rows="2" placeholder="Add memory manually... e.g. a standing instruction like \'when a pr arrives, review and merge or decline with comment\'"></textarea><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><select class="input-field" id="memNewCat" style="max-width:180px"><option value="instruction">instruction</option><option value="reflection">reflection</option><option value="task_outcome">task_outcome</option><option value="skill">skill</option><option value="general" selected>general</option></select><button class="btn btn-g btn-sm" onclick="addMemory()">Add Memory</button></div></div>';
  h+='<div class="input-card"><div class="mem-search"><input class="input-field" id="memSearch" placeholder="Search memory..." /><button class="btn btn-g" onclick="searchMemory()">Search</button></div><div class="mem-filters"><button class="mem-filter'+(S.memFilter==='all'?' active':'')+'" onclick="filterMem(\'all\')">All</button><button class="mem-filter'+(S.memFilter==='instruction'?' active':'')+'" onclick="filterMem(\'instruction\')">Instructions</button><button class="mem-filter'+(S.memFilter==='reflection'?' active':'')+'" onclick="filterMem(\'reflection\')">Reflections</button><button class="mem-filter'+(S.memFilter==='task_outcome'?' active':'')+'" onclick="filterMem(\'task_outcome\')">Task Outcomes</button><button class="mem-filter'+(S.memFilter==='skill'?' active':'')+'" onclick="filterMem(\'skill\')">Skills</button></div>';
  if(S.memFilter!=='all'){h+='<div style="margin-top:8px"><button class="btn btn-d btn-sm" onclick="clearMemCategory(\''+S.memFilter+'\')">Clear all '+esc(S.memFilter)+'</button></div>'}
  h+='</div>';

async function loadRateLimit(){
  try{const res=await fetch('/api/rate-limit');const d=await res.json();
  const presets=[['free','rlFree'],['standard','rlStandard'],['unlimited','rlUnlimited']];
  presets.forEach(([k,id])=>{const el=document.getElementById(id);const p=d.presets[k]||{};
    const active=Math.abs(d.rps-p.rps)<1e-9&&d.rpm===p.rpm;
    if(el)el.className='btn btn-sm '+(active?'btn-p':'btn-g');});
  const rps=document.getElementById('rlRps'),rpm=document.getElementById('rlRpm');
  if(rps)rps.value=d.rps;if(rpm)rpm.value=d.rpm;
  const eff=(d.rps||d.rpm)?(`Current: ${d.rps} req/s · ${d.rpm} req/min`):'Current: unlimited';
  const st=document.getElementById('rateLimitStatus');if(st)st.textContent=eff;
  }catch(e){const st=document.getElementById('rateLimitStatus');if(st)st.textContent='Failed to load'}}

  loadRateLimit();modalAlert('Rate Limit',d.message)}catch(e){modalAlert('Error',e.message,'error')}}

async function cancelCurrentTask(){

async function submitTask(){
  const inp=document.getElementById('goalInput');if(!inp)return;const goal=inp.value.trim();if(!goal)return;
  const msEl=document.getElementById('maxStepsInput');let max_steps=null;if(msEl&&msEl.value.trim()){const v=parseInt(msEl.value,10);if(v>=5&&v<=200)max_steps=v}
  const btn=document.getElementById('submitBtn');const lb=document.getElementById('loadingBar');btn.disabled=true;lb.style.display='flex';
  try{const res=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(max_steps?{goal,max_steps}:{goal})});if(!res.ok){const err=await res.json().catch(()=>({detail:res.statusText}));if(res.status===429)throw new Error('Rate limited (429) - Gemini quota hit. Wait 15s or add another GEMINI_API_KEY (comma-separated) for rotation.');throw new Error(err.detail||('Request failed: '+res.status))}const task=await res.json();S.tasks.unshift(task);S.selected=task;document.getElementById('taskCount').textContent=S.tasks.length;renderPage();renderTracePanel(document.getElementById('rpanelBody'));startLivePoll(task.id);switchRTab('thinking')}
  catch(e){modalAlert('Error',e.message,'error')}
  finally{btn.disabled=false;lb.style.display='none';if(document.getElementById('goalInput'))document.getElementById('goalInput').value=''}}

function selectTask(id){S.selected=S.tasks.find(t=>t.id===id)||null;renderPage();if(S.selected&&S.selected.id===S.liveTaskId&&S.liveEvents.length>0){renderRPanel()}else if(S.selected){renderTracePanel(document.getElementById('rpanelBody'))}}

async function deleteTask(id){
  const ok=await modalConfirm('Delete Task','Are you sure you want to delete this task?');
  if(!ok)return;
  try{await fetch('/api/tasks/'+id,{method:'DELETE'});S.tasks=S.tasks.filter(t=>t.id!==id);if(S.selected&&S.selected.id===id){S.selected=null}document.getElementById('taskCount').textContent=S.tasks.length;if(S.liveTaskId===id)stopLivePoll();renderPage();if(S.rtab==='thinking')renderThinkingPanel(document.getElementById('rpanelBody'))}catch(e){}}

async function searchMemory(){const q=document.getElementById('memSearch');const query=q?q.value.trim():'';try{let url='/api/memory';if(query)url+='?query='+encodeURIComponent(query);if(S.memFilter!=='all')url+=(url.includes('?')?'&':'?')+'category='+S.memFilter;const res=await fetch(url);S.memory=await res.json();renderPage()}catch(e){}}
function filterMem(f){S.memFilter=f;searchMemory()}
function toggleAutoRefresh(){S.autoRefresh=!S.autoRefresh;const t=document.getElementById('autoToggle');if(t)t.classList.toggle('on',S.autoRefresh);if(S.autoRefresh){S.pollInterval=setInterval(()=>{refreshAgentStatus();refreshApprovals()},10000);refreshAgentStatus();refreshApprovals()}else if(S.pollInterval){clearInterval(S.pollInterval);S.pollInterval=null}}

async function refreshAgentStatus(){try{const res=await fetch('/api/agent/status');const s=await res.json();S.agentStatus=s;const e=id=>document.getElementById(id);if(e('toolCount'))e('toolCount').textContent=s.tools_count;if(e('memSize'))e('memSize').textContent=s.memory_size;if(e('agentModel'))e('agentModel').textContent=s.model;if(e('memCount'))e('memCount').textContent=s.memory_size;if(e('apiText'))e('apiText').textContent='Connected';if(e('apiDot'))e('apiDot').className='sdot on'}catch(e){const el=id=>document.getElementById(id);if(el('apiText'))el('apiText').textContent='Disconnected';if(el('apiDot'))el('apiDot').className='sdot off'}}

async function refreshApprovals(){try{const res=await fetch('/api/approvals');S.approvals=await res.json();const count=S.approvals.length;const el=document.getElementById('approvalCount');if(el)el.textContent=count;const badge=document.querySelector('[data-page="approvals"] .nb');if(badge)badge.classList.toggle('alert',count>0);if(S.rtab==='approvals')renderApprovalPanel(document.getElementById('rpanelBody'))}catch(e){}}

function refreshAll(){refreshAgentStatus();refreshApprovals();loadTasks();refreshMemoryCount()}

async function loadTasks(){try{const res=await fetch('/api/tasks');const tasks=await res.json();if(tasks.length>0){S.tasks=tasks;document.getElementById('taskCount').textContent=S.tasks.length;if(S.page==='tasks'){const tl=document.getElementById('taskListEl');if(tl)renderTaskList(tl)}}}catch(e){}}

function renderTaskList(el){let html='';if(S.selected){html=renderDetail(S.selected)}else if(S.tasks.length===0){html='<div class="empty empty-big"><div style="font-size:24px;opacity:.3;margin-bottom:12px">&#9881;</div>No tasks yet<div class="empty-sub">Submit a goal above to get started</div></div>'}else{S.tasks.forEach(t=>{const a=S.selected&&S.selected.id===t.id;html+='<div class="task-card'+(a?' sel':'')+'" onclick="selectTask(\''+t.id+'\')"><div class="tc-row"><div class="tc-goal">'+esc(t.goal)+'</div><span class="badge b-'+t.status+'">'+t.status+'</span></div><div class="tc-meta"><span>'+(t.steps_count||0)+' steps</span><span>'+t.id.slice(0,8)+'</span></div>'+(t.result?'<div class="tc-result">'+esc(t.result.slice(0,300))+'</div>':'')+(t.error?'<div class="tc-error">'+esc(t.error)+'</div>':'')+'<div class="tc-actions"><button class="btn btn-d btn-sm" onclick="event.stopPropagation();deleteTask(\''+t.id+'\')">Delete</button></div></div>'})}el.innerHTML=html}

/* ── Live Visibility — WS global + SSE push + poller fallback ───── */
let S_eventSource=null;let S_ws=null;
function startLivePoll(id){stopLivePoll();S.liveEvents=[];S.liveStatus='running';S.liveTaskId=id;pollLive();S.livePoll=setInterval(pollLive,1500);startLiveStream(id);connectGlobalWS()}
function stopLivePoll(){if(S.livePoll){clearInterval(S.livePoll);S.livePoll=null}if(S_eventSource){try{S_eventSource.close()}catch(e){}S_eventSource=null}if(S_ws){try{S_ws.close()}catch(e){}S_ws=null}S.liveTaskId=null}
function connectGlobalWS(){
  try{
    if(typeof WebSocket==='undefined')return;
    if(S_ws&&S_ws.readyState===1)return;
    const proto=location.protocol==='https:'?'wss:':'ws:';
    const ws=new WebSocket(proto+'//'+location.host+'/api/ws');
    S_ws=ws;
    ws.onmessage=e=>{try{const msg=JSON.parse(e.data);const key=(msg.time||0)+':'+(msg.type||'')+':'+(msg.message||'').slice(0,40);if(S._seenWSKeys&&S._seenWSKeys.has(key))return;if(!S._seenWSKeys)S._seenWSKeys=new Set();S._seenWSKeys.add(key);if(S._seenWSKeys.size>800)S._seenWSKeys.clear();if(!msg.task_id||msg.task_id===S.liveTaskId){if(msg.type&&msg.message){S.liveEvents.push(msg);if(S.liveEvents.length>600)S.liveEvents.shift();if(S.rtab==='thinking'||S.rtab==='checklist')renderRPanel()}}if(msg.task_id){const t=S.tasks.find(x=>x.id===msg.task_id);if(t&&msg.type==='todo_update'&&msg.extra&&msg.extra.todos)t.todos=msg.extra.todos;if(t&&msg.type==='step_running')t.steps_count=(t.steps_count||0)}if(msg.source==='memory'||msg.source==='skill'||msg.source==='watcher'){refreshMemoryCount();if(msg.source==='watcher')refreshWatchers()}}catch(err){}};
    ws.onclose=()=>{S_ws=null;if(S.liveTaskId)setTimeout(connectGlobalWS,3000)};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }catch(e){}
}
function startLiveStream(id){
  try{
    if(typeof EventSource==='undefined')return;
    const es=new EventSource('/api/tasks/live/'+id+'/stream');
    S_eventSource=es;
    es.onmessage=e=>{
      if(e.data==='[DONE]'){es.close();return}
      try{const msg=JSON.parse(e.data);if(msg.type==='done'){pollLive()}else if(msg.type&&msg.message){S.liveEvents.push(msg);if(S.rtab==='thinking'||S.rtab==='checklist')renderRPanel()}}catch(err){}
    };
    es.onerror=()=>{try{es.close()}catch(e){}};
  }catch(e){}
}
async function pollLive(){if(!S.liveTaskId)return;try{const res=await fetch('/api/tasks/live/'+S.liveTaskId);const d=await res.json();S.liveEvents=d.events||[];S.liveStatus=d.status||'running';const t=S.tasks.find(x=>x.id===d.task_id);if(t){t.status=d.status;t.result=d.result||t.result;t.error=d.error||t.error;t.steps_count=d.steps_count||t.steps_count;t.elapsed_seconds=d.elapsed_seconds||t.elapsed_seconds;t.steps=d.steps||t.steps;t.todos=d.todos||t.todos;t.trace=d.trace||t.trace}if(S.rtab==='thinking'||S.rtab==='checklist'||S.rtab==='trace')renderRPanel();if(S.selected&&S.selected.id===d.task_id&&S.page==='tasks'){const tl=document.getElementById('taskListEl');if(tl)renderTaskList(tl);const lb=document.getElementById('loadingBar');if(lb)lb.style.display=['completed','failed'].includes(d.status)?'none':'flex'}if(['completed','failed'].includes(d.status)){stopLivePoll();refreshAll();refreshMemoryCount();refreshCredCount()}}catch(e){}}

/* ── Right Panel Minimize ─────────────────────────────────────── */
function toggleRPanel(){const min=!document.body.classList.contains('rp-min');document.body.classList.toggle('rp-min',min);try{localStorage.setItem('nm_rpanel_min',min?'1':'0')}catch(e){}}
try{if(localStorage.getItem('nm_rpanel_min')==='1')document.body.classList.add('rp-min')}catch(e){}

/* ── Init ─────────────────────────────────────────────────────── */
setInterval(refreshApprovals,3000);
setInterval(refreshWatchers,10000);
document.addEventListener('DOMContentLoaded',()=>{renderPage();refreshAgentStatus();refreshApprovals();loadTasks();refreshWatchers();refreshMemoryCount();refreshCredCount()});
</script>
