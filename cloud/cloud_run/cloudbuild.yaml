steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nexusmind-ai', '-f', 'cloud/cloud_run/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nexusmind-ai']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nexusmind-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nexusmind-ai'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,DATABASE_BACKEND=firestore,GOOGLE_CLOUD_REGION=us-central1'
      - '--set-secrets'
      - 'GITHUB_TOKEN=projects/$PROJECT_ID/secrets/GITHUB_TOKEN:latest,GEMINI_API_KEY=projects/$PROJECT_ID/secrets/GEMINI_API_KEY:latest'
images:
  - 'gcr.io/$PROJECT_ID/nexusmind-ai'
